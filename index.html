<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#090d16"
  >

  <title>Shiv Dhun</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- ============================= -->
  <!-- BACKGROUND -->
  <!-- ============================= -->

  <div class="backgrounds">

    <div
      class="bg bg-one active"
      aria-hidden="true"
    ></div>

    <div
      class="bg bg-two"
      aria-hidden="true"
    ></div>

    <div
      class="bg bg-three"
      aria-hidden="true"
    ></div>

    <div
      class="bg bg-four"
      aria-hidden="true"
    ></div>

  </div>


  <!-- ============================= -->
  <!-- BACKGROUND DARKENING -->
  <!-- ============================= -->

  <div
    class="background-shade"
    aria-hidden="true"
  ></div>


  <!-- ============================= -->
  <!-- CONTINUOUS SNOW -->
  <!-- ============================= -->

  <div
    id="snow-container"
    aria-hidden="true"
  ></div>


  <!-- ============================= -->
  <!-- MAIN PAGE -->
  <!-- ============================= -->

  <main class="page-shell">


    <!-- =========================== -->
    <!-- TOPBAR -->
    <!-- =========================== -->

    <header class="topbar">

      <a
        class="brand"
        href="#"
        aria-label="Shiv Dhun home"
      >

        <div class="brand-mark">
          ॐ
        </div>

        <span>
          Shiv Dhun
        </span>

      </a>


      <div class="nav-status">

        <i aria-hidden="true"></i>

        <span>
          Sacred frequencies
        </span>

      </div>

    </header>


    <!-- =========================== -->
    <!-- PLAYER -->
    <!-- =========================== -->

    <section class="hero">

      <div class="player-wrap">

        <div class="player-card">


          <!-- ===================== -->
          <!-- COMPACT PLAYER -->
          <!-- ===================== -->

          <div class="custom-player">


            <!-- =================== -->
            <!-- ANIMATED CD -->
            <!-- =================== -->

            <div
              class="cd-player"
              aria-hidden="true"
            >

              <div class="cd-glow"></div>


              <div class="cd-disc">

                <div
                  class="cd-ring ring-one"
                ></div>

                <div
                  class="cd-ring ring-two"
                ></div>

                <div
                  class="cd-ring ring-three"
                ></div>


                <div class="cd-light"></div>


                <div class="cd-center">

                  <div class="cd-hole"></div>

                </div>

              </div>

            </div>


            <!-- =================== -->
            <!-- TRACK AREA -->
            <!-- =================== -->

            <div class="track-content">


              <!-- Track information -->

              <div class="track-copy">

                <h2 id="track-title">
                  Shiv Kailasho Ke Vasi
                </h2>

                <p id="track-meta">
                  Track 10 of 16 · Online collection
                </p>

              </div>


              <!-- Progress -->

              <div class="timeline">

                <span id="current-time">
                  0:00
                </span>


                <div
                  class="progress-track"
                  id="progress-track"
                  role="slider"
                  aria-label="Track progress"
                  tabindex="0"
                >

                  <div
                    class="progress-fill"
                    id="progress-fill"
                  ></div>

                </div>


                <span id="duration">
                  0:00
                </span>

              </div>


              <!-- Controls -->

              <div
                class="transport"
                aria-label="Playback controls"
              >


                <button
                  id="prev-btn"
                  class="control-btn"
                  type="button"
                  aria-label="Previous track"
                >

                  <span>
                    ◀◀
                  </span>

                </button>


                <button
                  id="play-btn"
                  class="play-button"
                  type="button"
                  aria-label="Play"
                >

                  <span class="play-icon">
                    ▶
                  </span>

                </button>


                <button
                  id="next-btn"
                  class="control-btn"
                  type="button"
                  aria-label="Next track"
                >

                  <span>
                    ▶▶
                  </span>

                </button>


                <button
                  id="mute-btn"
                  class="control-btn"
                  type="button"
                  aria-label="Mute"
                >

                  <span>
                    ◉
                  </span>

                </button>


              </div>

            </div>

          </div>


          <!-- ===================== -->
          <!-- HIDDEN QUEUE -->
          <!-- ===================== -->

          <div
            class="queue"
            id="queue"
            aria-hidden="true"
          ></div>


          <!-- ===================== -->
          <!-- VISUALIZER -->
          <!-- ===================== -->

          <div class="player-foot">

            <div
              class="visualizer"
              aria-hidden="true"
            >

              <b></b>
              <b></b>
              <b></b>
              <b></b>
              <b></b>
              <b></b>
              <b></b>
              <b></b>
              <b></b>

            </div>

          </div>


        </div>

      </div>

    </section>


  </main>


  <!-- ============================= -->
  <!-- AUDIO -->
  <!-- ============================= -->

  <audio
    id="audio-player"
    preload="metadata"
  ></audio>


  <!-- ============================= -->
  <!-- JAVASCRIPT -->
  <!-- ============================= -->

  <script
    src="app.js"
  ></script>


</body>

</html>
